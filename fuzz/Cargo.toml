# Coverage-guided fuzzing for the parsers that eat bytes this project did not
# write. Its own `[workspace]`, deliberately: joining the main workspace would
# put libfuzzer-sys and a nightly-only build into the same Cargo.lock the
# reproducible release build depends on. Nothing here affects a shipped binary,
# and `cargo build` at the repo root never sees it.
#
# Requires a nightly toolchain (libFuzzer needs -Z flags). The repo's pinned
# 1.98.1 still governs every real build; nightly is only ever used here.
# The nightly is deliberately UNPINNED -- it floats, unlike every other
# toolchain surface here -- which is tolerable only because nothing this
# directory produces is ever released:
#
#     cargo +nightly fuzz run <target> -- -max_total_time=300
#
# WHAT IS AND IS NOT COVERED. Targets can only reach LIBRARY crates. The
# crates a REMOTE party can reach: the chat wire, the update and blocklist
# manifests, the delta decoder, and the licence token and receipt parsers.
#
# Since 2026-10-30 the app crate is a library too (crates/app/src/lib.rs, with
# a one-line launcher), and the app_* targets reach its own parsers through
# `patanyx_app::fuzz_api`, which exists only under the `fuzz-api` feature: the
# link readout, "Copy clean link", the stored snapshot picture and the
# blocklist set. Page integrity and download compare are still NOT covered:
# their entry points take the whole application state, and their byte-level
# decoding is the chat wire's, which is covered above.
#
# THE SAME wry AS A RELEASE. This is its own workspace, so the root
# [patch.crates-io] does not reach it; the patch is repeated below, and
# Cargo.lock here is seeded from the root lock so every crate the two share
# resolves to the version that ships (fuzz/README.md, "Same versions").
#
# `envelope::SessionEnvelope::decode` belongs on that list by reachability -- a
# peer's inner message -- but `mod envelope` is private and it is not
# re-exported, so it cannot be reached from here. Widening a crate's public API
# to suit a fuzzer is the wrong trade; it is listed as a known gap instead.
[package]
name = "patanyx-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
patanyx-chat = { path = "../crates/chat" }
patanyx-update = { path = "../crates/update" }
patanyx-licence = { path = "../crates/licence" }
patanyx-vault = { path = "../crates/vault" }
# The app's default features, as shipped, plus the fuzz pass-throughs.
patanyx = { path = "../crates/app", features = ["fuzz-api"] }

[patch.crates-io]
# The root workspace's patch, repeated because this workspace is separate: the
# app must link the wry a release links.
wry = { path = "../vendor/wry" }

[[bin]]
name = "app_hover_readout"
path = "fuzz_targets/app_hover_readout.rs"
test = false
doc = false

[[bin]]
name = "app_clean_link"
path = "fuzz_targets/app_clean_link.rs"
test = false
doc = false

[[bin]]
name = "app_bounded_picture"
path = "fuzz_targets/app_bounded_picture.rs"
test = false
doc = false

[[bin]]
name = "app_hostset"
path = "fuzz_targets/app_hostset.rs"
test = false
doc = false

[[bin]]
name = "chat_wire_decode"
path = "fuzz_targets/chat_wire_decode.rs"
test = false
doc = false

[[bin]]
name = "chat_wire_read_frame"
path = "fuzz_targets/chat_wire_read_frame.rs"
test = false
doc = false

[[bin]]
name = "update_manifest"
path = "fuzz_targets/update_manifest.rs"
test = false
doc = false

[[bin]]
name = "blocklist_manifest"
path = "fuzz_targets/blocklist_manifest.rs"
test = false
doc = false

[[bin]]
name = "update_delta"
path = "fuzz_targets/update_delta.rs"
test = false
doc = false

[[bin]]
name = "licence_token_parse"
path = "fuzz_targets/licence_token_parse.rs"
test = false
doc = false

[[bin]]
name = "licence_receipt_parse"
path = "fuzz_targets/licence_receipt_parse.rs"
test = false
doc = false

[workspace]

[[bin]]
name = "backup_records"
path = "fuzz_targets/backup_records.rs"
test = false
doc = false
