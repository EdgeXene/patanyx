[package]
name = "patanyx-corroborate"
version = "0.1.0"
license = "Apache-2.0"
edition = "2021"

[dependencies]
# Reuses the normalization ladder rather than reimplementing hashing.
patanyx-integrity = { path = "../integrity" }
serde = { version = "1", features = ["derive"] }
# Used by the library, not only the tests: request/response frames are JSON.
serde_json = "1"
thiserror = "2"

