[workspace]
resolver = "2"
# crates/relay is ABSENT on purpose (OSS split, 2026-08-05): the relay is
# proprietary server infrastructure and lives in its own repository at
# ../patanyx-relay, consuming the open chat and licence crates by path. The
# wire protocol it speaks stays open here, in crates/chat.
members = ["crates/vault", "crates/app", "crates/ocr", "crates/chat", "crates/integrity", "crates/store", "crates/corroborate", "crates/update", "crates/tunnel", "crates/licence"]

[patch.crates-io]
# wry 0.55.1 installs a frozen window.ipc in every content page even when the
# builder has no IPC handler. Keep the patch local and auditable until both
# WebView2 and WebKitGTK condition their bootstrap upstream.
wry = { path = "vendor/wry" }

[profile.release]
lto = true
strip = true
